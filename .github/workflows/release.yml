name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versao a partir da tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Atualizar module.json (versao + URLs do repo)
        env:
          REPO: ${{ github.repository }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const repo = process.env.REPO, ver = process.env.VER;
            m.version = ver;
            m.url = `https://github.com/${repo}`;
            m.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
            m.download = `https://github.com/${repo}/releases/download/v${ver}/module.zip`;
            m.readme = `https://github.com/${repo}/blob/main/README.md`;
            m.changelog = `https://github.com/${repo}/blob/main/CHANGELOG.md`;
            m.bugs = `https://github.com/${repo}/issues`;
            if (Array.isArray(m.authors) && m.authors[0]) m.authors[0].url = `https://github.com/${repo.split("/")[0]}`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2));
          '

      - name: Empacotar module.zip (module.json na raiz)
        run: |
          zip -r module.zip module.json scripts styles lang templates data README.md CHANGELOG.md LICENSE

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.v.outputs.version }}
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
